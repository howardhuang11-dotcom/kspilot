[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kspilot"
version = "1.0.0"
description = "Autonomous ascent, deorbit, entry and propulsive landing guidance for Kerbal Space Program via kRPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Howard Huang" }]
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dependencies = [
    "krpc==0.6.0",
    "numpy>=2.0",
    "scipy>=1.11",
    "cvxpy>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# GPL-3.0-only dependency (obsws-python): optional, not required by the guidance code
recording = ["obsws-python==1.8.0", "Pillow>=10"]

[tool.setuptools]
packages = ["kspilot", "kspilot.rdv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
